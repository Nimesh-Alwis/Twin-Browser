<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twin-Browser Startpage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #140b24 url('purple_sunset_wallpaper.png') no-repeat center center fixed;
            background-size: cover;
            color: #f3e8ff;
            overflow: hidden;
            user-select: none;
            transition: background 0.4s ease-in-out;
        }

        /* Overlay for subtle dark contrast */
        .backdrop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(20, 11, 36, 0.2) 0%, rgba(20, 11, 36, 0.7) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Brand Title */
        .brand {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(192, 132, 252, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand span {
            background: linear-gradient(135deg, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Box Bar */
        .search-box {
            width: 100%;
            max-width: 680px;
            position: relative;
            background: rgba(35, 18, 60, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 30px;
            padding: 6px 10px 6px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            background: rgba(45, 22, 75, 0.75);
            border-color: #c084fc;
            box-shadow: 0 0 25px rgba(192, 132, 252, 0.5);
            transform: scale(1.01);
        }

        .search-icon {
            font-size: 1.2rem;
            color: #c084fc;
            margin-right: 12px;
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1.05rem;
            font-family: inherit;
        }

        .search-input::placeholder {
            color: #b8a2d1;
        }

        .search-btn {
            background: linear-gradient(135deg, #a855f7, #c084fc);
            border: none;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .search-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Speed Dial Grid */
        .speed-dial {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 820px;
            margin-top: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding: 8px;
        }

        /* Custom Scrollbar for tiles grid */
        .speed-dial::-webkit-scrollbar {
            width: 6px;
        }
        .speed-dial::-webkit-scrollbar-thumb {
            background: rgba(192, 132, 252, 0.4);
            border-radius: 4px;
        }

        .tile {
            position: relative;
            background: rgba(30, 15, 50, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(192, 132, 252, 0.25);
            border-radius: 16px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #f3e8ff;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tile:hover {
            background: rgba(55, 25, 90, 0.8);
            border-color: #c084fc;
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(192, 132, 252, 0.3);
        }

        .tile-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
        }

        .tile-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: #e9d5ff;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85px;
        }

        .tile-delete {
            position: absolute;
            top: 4px;
            right: 6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.8);
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .tile:hover .tile-delete {
            opacity: 1;
        }

        .tile-delete:hover {
            transform: scale(1.2);
            background: #dc2626;
        }

        .add-tile {
            border: 2px dashed rgba(192, 132, 252, 0.4);
            background: rgba(25, 12, 42, 0.4);
        }

        .add-tile:hover {
            border-color: #c084fc;
            background: rgba(55, 25, 90, 0.6);
        }

        /* Modal Dialog Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 5, 20, 0.75);
            backdrop-filter: blur(8px);
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: #1c0d35;
            border: 1px solid rgba(192, 132, 252, 0.4);
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #c084fc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #d8b4fe;
        }

        .form-group input {
            background: #281347;
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: #c084fc;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #e9d5ff;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-save {
            background: linear-gradient(135deg, #a855f7, #c084fc);
            border: none;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Wallpaper Switcher Panel */
        .wallpaper-controls {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 3;
            display: flex;
            gap: 8px;
        }

        .wp-btn {
            background: rgba(25, 12, 42, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(192, 132, 252, 0.3);
            color: #d8b4fe;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .wp-btn:hover {
            background: #a855f7;
            color: #140b24;
            border-color: #c084fc;
        }
    </style>
</head>
<body>
    <div class="backdrop-overlay"></div>

    <div class="container">
        <!-- Brand Title -->
        <div class="brand">
            🌐 <span>Twin-Browser</span>
        </div>

        <!-- Centered Search Box -->
        <form class="search-box" id="searchForm" onsubmit="handleSearch(event)">
            <span class="search-icon">🔍</span>
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Search the Web or enter an address..." 
                autofocus
                autocomplete="off"
            >
            <button type="submit" class="search-btn">Search</button>
        </form>

        <!-- Dynamic Speed Dial Grid -->
        <div class="speed-dial" id="speedDial"></div>
    </div>

    <!-- Add Shortcut Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-card">
            <div class="modal-title">➕ Add Custom Shortcut</div>
            
            <div class="form-group">
                <label>Website Name</label>
                <input type="text" id="shortcutName" placeholder="e.g. Facebook, LinkedIn, ChatGPT...">
            </div>

            <div class="form-group">
                <label>Website URL</label>
                <input type="text" id="shortcutUrl" placeholder="e.g. https://facebook.com">
            </div>

            <div class="form-group">
                <label>Icon / Emoji (Optional)</label>
                <input type="text" id="shortcutIcon" placeholder="e.g. 📘, 💼, 🚀 (or leave blank)">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveShortcut()">Save Shortcut</button>
            </div>
        </div>
    </div>

    <!-- Wallpaper Switcher Bar -->
    <div class="wallpaper-controls">
        <button class="wp-btn" onclick="setWallpaper('sunset')">🌄 Sunset</button>
        <button class="wp-btn" onclick="setWallpaper('cyber')">🌆 Neon Cyber</button>
        <button class="wp-btn" onclick="setWallpaper('aurora')">🌌 Aurora Space</button>
        <button class="wp-btn" onclick="document.getElementById('localWpInput').click()">📁 Custom Wallpaper</button>
        <input type="file" id="localWpInput" accept="image/*" style="display:none;" onchange="uploadLocalWallpaper(event)">
    </div>

    <script>
        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            if (query.startsWith('http://') || query.startsWith('https://')) {
                window.location.href = query;
            } else if (query.includes('.') && !query.includes(' ')) {
                window.location.href = 'https://' + query;
            } else {
                window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
            }
        }

        const defaultTiles = [
            { title: 'Google', url: 'https://www.google.com', icon: 'G', color: '#4285F4' },
            { title: 'YouTube', url: 'https://www.youtube.com', icon: '▶', color: '#FF0000' },
            { title: 'GitHub', url: 'https://github.com', icon: '🐙', color: '#ffffff' },
            { title: 'Wikipedia', url: 'https://www.wikipedia.org', icon: 'W', color: '#e2e8f0' },
            { title: 'ChatGPT', url: 'https://chatgpt.com', icon: '🤖', color: '#10a37f' },
            { title: 'Reddit', url: 'https://www.reddit.com', icon: '🔥', color: '#FF4500' },
            { title: 'Weather', url: 'https://www.accuweather.com', icon: '☀️', color: '#ffb703' }
        ];

        function getTiles() {
            const saved = localStorage.getItem('twin_tiles');
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch(e) {
                    console.log("Failed to parse saved tiles:", e);
                }
            }
            return defaultTiles;
        }

        function saveTiles(tiles) {
            localStorage.setItem('twin_tiles', JSON.stringify(tiles));
        }

        function renderTiles() {
            const grid = document.getElementById('speedDial');
            grid.innerHTML = '';
            const tiles = getTiles();

            tiles.forEach((tile, index) => {
                const a = document.createElement('a');
                a.className = 'tile';
                a.href = tile.url;

                const iconDiv = document.createElement('div');
                iconDiv.className = 'tile-icon';
                if (tile.color) {
                    iconDiv.style.color = tile.color;
                } else {
                    iconDiv.style.color = '#c084fc';
                }
                iconDiv.textContent = tile.icon || tile.title.charAt(0).toUpperCase();

                const titleSpan = document.createElement('span');
                titleSpan.className = 'tile-title';
                titleSpan.textContent = tile.title;

                const delBtn = document.createElement('div');
                delBtn.className = 'tile-delete';
                delBtn.innerHTML = '×';
                delBtn.title = 'Delete Shortcut';
                delBtn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    deleteTile(index);
                };

                a.appendChild(iconDiv);
                a.appendChild(titleSpan);
                a.appendChild(delBtn);
                grid.appendChild(a);
            });

            // Add Shortcut (+) Button Tile
            const addTile = document.createElement('div');
            addTile.className = 'tile add-tile';
            addTile.onclick = openModal;

            const addIcon = document.createElement('div');
            addIcon.className = 'tile-icon';
            addIcon.style.color = '#c084fc';
            addIcon.textContent = '➕';

            const addTitle = document.createElement('span');
            addTitle.className = 'tile-title';
            addTitle.textContent = 'Add Shortcut';

            addTile.appendChild(addIcon);
            addTile.appendChild(addTitle);
            grid.appendChild(addTile);
        }

        function deleteTile(index) {
            let tiles = getTiles();
            tiles.splice(index, 1);
            saveTiles(tiles);
            renderTiles();
        }

        function openModal() {
            document.getElementById('shortcutName').value = '';
            document.getElementById('shortcutUrl').value = '';
            document.getElementById('shortcutIcon').value = '';
            document.getElementById('addModal').style.display = 'flex';
            document.getElementById('shortcutName').focus();
        }

        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        function saveShortcut() {
            const name = document.getElementById('shortcutName').value.trim();
            let url = document.getElementById('shortcutUrl').value.trim();
            let icon = document.getElementById('shortcutIcon').value.trim();

            if (!name || !url) {
                alert("Please enter both Website Name and URL!");
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            if (!icon) {
                icon = name.charAt(0).toUpperCase();
            }

            const tiles = getTiles();
            tiles.push({
                title: name,
                url: url,
                icon: icon,
                color: '#c084fc'
            });

            saveTiles(tiles);
            renderTiles();
            closeModal();
        }

        const wallpapers = {
            'sunset': "url('purple_sunset_wallpaper.png')",
            'cyber': "linear-gradient(135deg, #0f0c20 0%, #2b1055 50%, #7597de 100%)",
            'aurora': "linear-gradient(135deg, #090a0f 0%, #171b30 40%, #2c1a4d 70%, #581c87 100%)"
        };

        function setWallpaper(theme) {
            if (wallpapers[theme]) {
                document.body.style.background = wallpapers[theme] + " no-repeat center center fixed";
                document.body.style.backgroundSize = "cover";
                localStorage.setItem('twin_wallpaper', theme);
                localStorage.removeItem('twin_custom_wp_data');
            }
        }

        function uploadLocalWallpaper(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    document.body.style.background = "url('" + dataUrl + "') no-repeat center center fixed";
                    document.body.style.backgroundSize = "cover";
                    try {
                        localStorage.setItem('twin_custom_wp_data', dataUrl);
                        localStorage.removeItem('twin_wallpaper');
                    } catch(err) {
                        console.log("Local storage full for large image:", err);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // Restore saved wallpaper & tiles on load
        const customData = localStorage.getItem('twin_custom_wp_data');
        const savedWp = localStorage.getItem('twin_wallpaper');

        if (customData) {
            document.body.style.background = "url('" + customData + "') no-repeat center center fixed";
            document.body.style.backgroundSize = "cover";
        } else if (savedWp && wallpapers[savedWp]) {
            setWallpaper(savedWp);
        }

        renderTiles();
    </script>
</body>
</html>
